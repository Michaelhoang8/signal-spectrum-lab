[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-spectrum-lab"
version = "1.0.0"
description = "Source-built FFT and calibrated spectral analysis of synthetic PCM audio"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
